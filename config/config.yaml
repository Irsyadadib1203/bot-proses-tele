# Default application configuration for Bulk Order Bot
telegram:
  bot_token: "" # Leave empty here and set in .env as TELEGRAM_BOT_TOKEN
  allowed_user_ids:
    - 123456789 # Ganti dengan ID Telegram Anda atau set via env ALLOWED_TELEGRAM_USER_IDS
  rate_limit_per_minute: 10

target:
  base_url: "https://api.ffzstore.com/v1"
  api_key: ""
  api_secret: ""
  callback_url: "https://bot.irxplay.com/webhook/callback"
  timeout_ms: 20000

database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  dbname: "bulk_order_db"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_seconds: 300

worker:
  concurrency: 5
  max_qty_per_batch: 200
  shutdown_timeout_sec: 30

webhook_port: "8080"

# Mapping kode produk bot -> kode produk di API FFZ Store
products:
  ML5: "S1_1187"
  ML10: "S1_1188"
  ML50: "S1_1189"
  FF5: "FF_5_DM"
  FF50: "FF_50_DM"
